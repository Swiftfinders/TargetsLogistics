[build]
builder = "DOCKERFILE"
dockerfilePath = "apps/api/Dockerfile"
watchPatterns = ["apps/api/**", "packages/shared/**", "packages/config/**", "pnpm-lock.yaml"]

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
# Run migrations as the release command, never in the build step — Railway builds
# can run more than once and concurrently, and a build-step migration can race.
releaseCommand = "node_modules/.bin/prisma migrate deploy --schema=./prisma/schema.prisma"
# Railway's startCommand replaces Docker CMD but NOT ENTRYPOINT — a compound
# shell command (&&) here was silently swallowed by exec-form ENTRYPOINT parsing,
# causing prisma to run but node to never start.  Migrations are handled by
# releaseCommand above; startCommand only needs to start the server.
startCommand = "node dist/server.js"
